# Hogar de los Alpes - Entrega 4 (desarrollo local).
# Pulsar standalone + pulsar-init (topología) + 4 PostgreSQL (uno por servicio) + servicios.
# Los servicios de los compañeros quedan comentados hasta que existan sus carpetas,
# para que `docker compose up` siempre funcione.
services:

  # ---------------------------------------------------------------------------
  # Broker de eventos: Pulsar en modo standalone (en producción sería un clúster).
  # ---------------------------------------------------------------------------
  pulsar:
    image: apachepulsar/pulsar:3.3.1
    command: bin/pulsar standalone
    ports:
      - "6650:6650"   # protocolo binario (productores/consumidores)
      - "8080:8080"   # REST de administración
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/admin/v2/clusters || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Job efímero: crea tenant, namespace, tópicos, retención y política de esquemas.
  # Corre una vez y termina; los servicios esperan a que complete.
  pulsar-init:
    image: apachepulsar/pulsar:3.3.1
    depends_on:
      pulsar:
        condition: service_healthy
    environment:
      PULSAR_ADMIN_URL: http://pulsar:8080
    volumes:
      - ./infra/pulsar:/infra/pulsar:ro
    command: ["bash", "/infra/pulsar/crear_topicos.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Topología de datos descentralizada: una base por servicio, credenciales
  # de desarrollo distintas. La BD compartida fue el dolor del monolito (AS-IS).
  # ---------------------------------------------------------------------------
  postgres-siniestros:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siniestros
      POSTGRES_PASSWORD: siniestros
      POSTGRES_DB: siniestros
    ports:
      - "5433:5432"
    volumes:
      - pgdata-siniestros:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siniestros"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-integraciones:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: integraciones
      POSTGRES_PASSWORD: integraciones
      POSTGRES_DB: integraciones
    ports:
      - "5434:5432"
    volumes:
      - pgdata-integraciones:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integraciones"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-reglas:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reglas
      POSTGRES_PASSWORD: reglas
      POSTGRES_DB: reglas
    ports:
      - "5435:5432"
    volumes:
      - pgdata-reglas:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reglas"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-matching:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: matching
      POSTGRES_PASSWORD: matching
      POSTGRES_DB: matching
    ports:
      - "5436:5432"
    volumes:
      - pgdata-matching:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matching"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # S2 - Trabajos Siniestros (Entrega 3). Único servicio activo por ahora.
  # ---------------------------------------------------------------------------
  siniestros:
    build: ./src/siniestros
    depends_on:
      postgres-siniestros:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres-siniestros
      DB_PORT: "5432"
      DB_USER: siniestros
      DB_PASSWORD: siniestros
      DB_NAME: siniestros
      PULSAR_URL: pulsar://pulsar:6650
      PULSAR_ADMIN_URL: http://pulsar:8080
      # Nombres completos en el namespace nuevo (antes: eventos.trabajos en public/default).
      TOPICO_EVENTOS: persistent://hogar-alpes/siniestros-b2b2c/eventos.siniestros
      TOPICO_COMANDOS: persistent://hogar-alpes/siniestros-b2b2c/comandos.siniestros
      CONSUMIR_COMANDOS: "true"
      PORT: "5000"
    ports:
      - "8000:5000"

  # ---------------------------------------------------------------------------
  # S9 - Integraciones Partners (Luis). Se habilita en el Paso 4.
  # ---------------------------------------------------------------------------
  # integraciones:
  #   build: ./src/integraciones
  #   depends_on:
  #     postgres-integraciones:
  #       condition: service_healthy
  #     pulsar-init:
  #       condition: service_completed_successfully
