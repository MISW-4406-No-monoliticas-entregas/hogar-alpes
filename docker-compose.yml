services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siniestros
      POSTGRES_PASSWORD: siniestros
      POSTGRES_DB: siniestros
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siniestros"]
      interval: 5s
      timeout: 5s
      retries: 10

  pulsar:
    image: apachepulsar/pulsar:3.3.1
    command: bin/pulsar standalone
    ports:
      - "6650:6650"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/admin/v2/clusters || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  siniestros:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: siniestros
      DB_PASSWORD: siniestros
      DB_NAME: siniestros
      PULSAR_URL: pulsar://pulsar:6650
      TOPICO_EVENTOS: eventos.trabajos
      TOPICO_COMANDOS: comandos.siniestros
      CONSUMIR_COMANDOS: "true"
      PORT: "5000"
    ports:
      - "5000:5000"

volumes:
  pgdata:
